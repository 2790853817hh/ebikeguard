<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 电动车不安全使用行为识别系统</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="container container-narrow" style="padding-top:36px">

  <div style="text-align:center;margin-bottom:22px">
    <div style="font-size:40px">🛵</div>
    <h1 style="font-size:20px;margin:8px 0 4px">电动车不安全使用行为识别系统</h1>
    <p class="subtle" style="margin:0">拍照上报 · AI 初审 · 人工复核 · 结果反馈</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tabSms" class="active">手机号登录（上报人）</button>
      <button id="tabPwd">账号登录（管理端）</button>
    </div>

    <!-- 手机号 + 短信验证码 -->
    <div id="paneSms">
      <label class="field">
        <span class="lbl">手机号 <span class="req">*</span></span>
        <input type="tel" id="phone" placeholder="请输入 11 位手机号" maxlength="11" inputmode="numeric" autocomplete="tel">
      </label>
      <label class="field">
        <span class="lbl">短信验证码 <span class="req">*</span></span>
        <div style="display:flex;gap:8px">
          <input type="text" id="code" placeholder="6 位验证码" maxlength="8" inputmode="numeric" autocomplete="one-time-code">
          <button class="btn" id="btnSendCode" style="white-space:nowrap;min-width:118px">获取验证码</button>
        </div>
      </label>
      <div id="devCodeHint" class="notice" style="display:none;margin-bottom:12px"></div>
      <button class="btn btn-primary btn-block" id="btnSmsLogin">登录 / 注册并上报</button>
      <p class="subtle" style="margin-top:12px;font-size:12.5px">
        首次使用手机号登录即自动注册为上报人。上报前请阅读并同意隐私提示：请勿拍摄可识别人脸、车牌的清晰画面。
      </p>
    </div>

    <!-- 账号密码 -->
    <div id="panePwd" style="display:none">
      <label class="field">
        <span class="lbl">账号 <span class="req">*</span></span>
        <input type="text" id="username" placeholder="审核员 / 管理员账号" autocomplete="username">
      </label>
      <label class="field">
        <span class="lbl">密码 <span class="req">*</span></span>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-block" id="btnPwdLogin">登录</button>
      <div class="notice" style="margin-top:14px;font-size:12.5px">
        演示账号：<b>admin / Admin@12345</b>（管理员）、<b>reviewer1 / Review@12345</b>（审核员）
      </div>
    </div>
  </div>

  <p class="subtle" style="text-align:center;font-size:12.5px">
    本系统仅用于电动车消防安全隐患的上报与核实，请如实填写并妥善使用。
  </p>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  var A = window.API;
  // 已登录则直接跳转
  if (A.Auth.token) { location.replace(A.Auth.home()); return; }

  A.$('#tabSms').onclick = function () { switchTab(true); };
  A.$('#tabPwd').onclick = function () { switchTab(false); };

  function switchTab(isSms) {
    A.$('#tabSms').classList.toggle('active', isSms);
    A.$('#tabPwd').classList.toggle('active', !isSms);
    A.$('#paneSms').style.display = isSms ? '' : 'none';
    A.$('#panePwd').style.display = isSms ? 'none' : '';
  }

  var cooldown = 0, timer = null;
  A.$('#btnSendCode').onclick = async function () {
    var phone = A.$('#phone').value.trim();
    if (!/^1\d{10}$/.test(phone)) { A.Toast.error('请输入正确的 11 位手机号'); return; }
    var btn = this;
    btn.disabled = true;
    try {
      var res = await A.api('/auth/sms/send', { method: 'POST', body: { phone: phone }, auth: false });
      A.Toast.success(res.message || '验证码已发送');
      if (res.dev_code) {
        var hint = A.$('#devCodeHint');
        hint.style.display = '';
        hint.innerHTML = '开发环境模拟验证码：<b>' + A.escapeHtml(res.dev_code) + '</b>（生产环境将由短信下发）';
        A.$('#code').value = res.dev_code;
      }
      cooldown = 60;
      timer = setInterval(function () {
        cooldown--;
        btn.textContent = cooldown + 's 后重发';
        if (cooldown <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
      }, 1000);
    } catch (e) {
      btn.disabled = false;
      A.Toast.error(e.message);
    }
  };

  A.$('#btnSmsLogin').onclick = async function () {
    var phone = A.$('#phone').value.trim(), code = A.$('#code').value.trim();
    if (!/^1\d{10}$/.test(phone)) { A.Toast.error('请输入正确的手机号'); return; }
    if (!code) { A.Toast.error('请输入验证码'); return; }
    var btn = this; btn.disabled = true;
    try {
      var data = await A.api('/auth/sms/login', { method: 'POST', body: { phone: phone, code: code }, auth: false });
      A.Auth.save(data);
      A.Toast.success('登录成功');
      setTimeout(function () { location.replace(A.Auth.home()); }, 500);
    } catch (e) { btn.disabled = false; A.Toast.error(e.message); }
  };

  A.$('#btnPwdLogin').onclick = async function () {
    var username = A.$('#username').value.trim(), password = A.$('#password').value;
    if (!username || !password) { A.Toast.error('请输入账号和密码'); return; }
    var btn = this; btn.disabled = true;
    try {
      var data = await A.api('/auth/login', { method: 'POST', body: { username: username, password: password }, auth: false });
      A.Auth.save(data);
      A.Toast.success('登录成功');
      setTimeout(function () { location.replace(A.Auth.home()); }, 500);
    } catch (e) { btn.disabled = false; A.Toast.error(e.message); }
  };

  A.$('#password').addEventListener('keydown', function (e) { if (e.key === 'Enter') A.$('#btnPwdLogin').click(); });
  A.$('#code').addEventListener('keydown', function (e) { if (e.key === 'Enter') A.$('#btnSmsLogin').click(); });
})();
</script>
</body>
</html>
