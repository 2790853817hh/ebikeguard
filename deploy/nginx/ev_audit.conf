# ============================================================
# 电动车不安全使用行为识别系统 — Nginx 站点配置（阿里云 Linux）
# 放置到 /etc/nginx/conf.d/ev_audit.conf
# 要点：HTTPS 终端、限流、请求体大小、静态资源、图片鉴权访问、安全响应头
# ============================================================

# --- 限流区（防刷：登录/短信/上传重点限流） ---
limit_req_zone $binary_remote_addr zone=ev_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ev_upload:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ev_api:10m rate=300r/m;

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name ebikeguard.xyz www.ebikeguard.xyz;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 写法必须匹配 nginx 版本：
    #   - 独立的 `http2 on;` 仅在 nginx ≥ 1.25.1 存在；Ubuntu 24.04 自带 1.24.0，
    #     写它会直接 `nginx -t` 报 unknown directive → reload 失败、443 根本不监听。
    #   - `listen ... http2` 在 1.25.1+ 会打一条 deprecation 警告，但功能正常。
    # 因此这里统一用兼容写法（2026-10-11 实测踩到）。
    listen 443 ssl http2;
    server_name ebikeguard.xyz www.ebikeguard.xyz;

    # --- 证书（阿里云可申请免费证书；建议 certbot 自动续期） ---
    ssl_certificate     /etc/nginx/ssl/ebikeguard.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/ebikeguard.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- 安全响应头 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 上传体积（单次最多 9 张 × 15MB，留出余量） ---
    client_max_body_size 50m;
    client_body_timeout 120s;

    # 应用日志
    access_log /var/log/nginx/ev_audit.access.log;
    error_log  /var/log/nginx/ev_audit.error.log;

    # --- 图片内部重定向（可选高性能方案） ---
    # 若在 .env 中启用 X-Accel 方案，可把 data/images 映射为内部位置，
    # 由 FastAPI 返回 X-Accel-Redirect 头，Nginx 直接发文件，省去 Python 传输开销。
    location /__images_internal/ {
        internal;
        alias /opt/ev_audit/data/images/;
    }

    # --- 认证 / 短信接口：严格限流 ---
    location ~ ^/api/v1/auth/(sms/send|login) {
        limit_req zone=ev_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/ev_proxy_params.inc;
    }

    # --- 上报上传接口 ---
    location = /api/v1/reports {
        limit_req zone=ev_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/ev_proxy_params.inc;
    }

    # --- 其余 API ---
    location /api/ {
        limit_req zone=ev_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/ev_proxy_params.inc;
    }

    # --- 静态资源（CSS / JS / 图片 / 字体）：必须精确命中，**禁止兜底成 HTML** ---
    # 缺陷背景（2026-10-12）：原先统一 `try_files $uri $uri/ /index.html`，
    # 路径写错时（如 /admin/css/base.css）Nginx 会返回 index.html 的 HTML 且状态码 200，
    # 浏览器把 text/html 当 CSS/JS 解析 → 样式或脚本静默失效、整页裸排，
    # 且控制台"看起来"只有一条无关的 MIME 警告，排查成本极高。
    # 这里显式返回 404，让错误在第一时间暴露（浏览器会明确报错、便于定位）。
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
        root /opt/ev_audit/static;
        try_files $uri =404;
        expires 10m;
        access_log off;
    }

    # --- 静态前端页面：仅 HTML 与目录请求才回退到 index.html ---
    location / {
        root /opt/ev_audit/static;
        index index.html;
        # 只对「非文件资源」的路径做 SPA 回退；带扩展名的路径若不存在直接 404（交给上面的 location）
        try_files $uri $uri/ /index.html;
        expires 10m;
    }
}
